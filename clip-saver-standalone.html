<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="收藏夹">
<meta name="theme-color" content="#6c5ce7">
<title>随手收藏</title>
<style>
:root{
  --bg:#f5f6fa;
  --card:#ffffff;
  --ink:#2d3436;
  --muted:#b2bec3;
  --line:#eceff4;
  --primary:#6c5ce7;
  --primary-d:#5945d6;
  --danger:#e74c3c;
  --radius:16px;
  --tab-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.5;}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));}

.topbar{position:sticky;top:0;z-index:20;background:rgba(245,246,250,.92);
  backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  border-bottom:1px solid var(--line);}
.brand{font-weight:700;font-size:18px;margin-bottom:8px;}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:10px 12px;font-size:15px;outline:none;}
.search:focus{border-color:var(--primary);}

.view{display:none;padding:14px;}
.view.active{display:block;}

/* 筛选：横排，带序号，去长方形色块感 */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;
  -webkit-overflow-scrolling:touch;}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);
  background:#fff;border-radius:10px;padding:6px 12px;font-size:13px;color:var(--ink);white-space:nowrap;}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip .chip-num{font-size:11px;font-weight:700;opacity:.6;}
.chip.active .chip-num{opacity:.95;}

/* 列表：横排条目，每行带序号，分类用小色圈序号（不要长方形） */
.list{display:flex;flex-direction:column;gap:10px;}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;
  padding:8px;box-shadow:0 1px 6px rgba(0,0,0,.05);cursor:pointer;position:relative;}
.card .seq{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#efeafc;color:var(--primary);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.card .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;object-position:top center;background:#fff;border:1px solid #eceef3;flex:0 0 auto;display:block;}
.card .thumb.empty{background:#f1f0fe;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:14px;}
.card .body{flex:1;min-width:0;}
.card .cat{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#636e72;margin-bottom:3px;}
.card .cat .cat-num{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;color:#fff;font-size:9px;}
.card .ttl{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.card .del{flex:0 0 auto;width:30px;height:30px;border:none;border-radius:50%;background:#fceae8;color:var(--danger);
  font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:2px;}
.card .del:active{background:#f6d4cf;}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;}

/* 添加 */
.add-wrap{display:flex;flex-direction:column;gap:14px;}
.drop{display:block;cursor:pointer;}
.preview-box{position:relative;border:2px dashed var(--line);border-radius:var(--radius);
  background:#fff;min-height:200px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;}
.drop-hint{text-align:center;color:var(--muted);font-size:15px;line-height:1.8;}
.preview-img{width:100%;display:block;}
.row{display:flex;gap:10px;align-items:center;}
.row.between{justify-content:space-between;}
.field{display:flex;flex-direction:column;gap:6px;}
.field>span{font-size:13px;color:#636e72;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);
  background:#fff;border-radius:12px;padding:11px 12px;font-size:15px;outline:none;
  font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical;}
.title-row{display:flex;gap:8px;align-items:center;}
.title-row input{flex:1;}
.title-row .btn{flex:0 0 auto;white-space:nowrap;}
.auto-hint{font-size:12px;color:var(--primary);font-weight:600;}
.ocr-status{font-size:13px;color:#636e72;background:#fff;border-radius:10px;
  padding:8px 10px;border:1px solid var(--line);}

/* 按钮 */
.btn{border:none;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;
  background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:active{background:var(--primary-d);}
.btn.ghost{background:#fff;border:1px solid var(--line);}
.btn.tiny{padding:7px 10px;font-size:13px;font-weight:500;background:#f1f0fe;color:var(--primary);}
.btn.danger{background:var(--danger);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.block{width:100%;}

/* 详情 */
.detail{background:#fff;border-radius:var(--radius);overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.04);}
.detail img{width:100%;display:block;background:#eee;}
.detail .meta{padding:14px;}
.detail .cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#636e72;margin-right:6px;}
.detail .cat .cat-num{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;}
.detail h3{margin:10px 0 4px;font-size:18px;}
.detail .tags{margin:8px 0;}
.detail .tag{display:inline-block;font-size:12px;background:#f1f0fe;color:var(--primary);
  border-radius:6px;padding:3px 8px;margin:0 6px 6px 0;}
.detail .text{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.8;
  color:#2d3436;margin-top:12px;user-select:text;-webkit-user-select:text;}
.detail .time{font-size:12px;color:var(--muted);margin-top:10px;}
.detail-actions{margin-top:14px;}

/* 详情页链接 */
.detail .link{display:inline-flex;align-items:center;max-width:100%;color:#fff;background:var(--primary);
  text-decoration:none;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;word-break:break-all;}
.detail .link:active{background:var(--primary-d);}
.detail .link-text{margin-top:12px;font-size:13px;color:#636e72;word-break:break-all;}

/* 详情图：可点击放大 */
.detail .shot{margin:0;position:relative;cursor:zoom-in;background:#eee;}
.detail .shot img{display:block;width:100%;}
.detail .shot figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);
  color:#fff;font-size:12px;text-align:center;padding:6px;pointer-events:none;}

/* 全屏看图 */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:flex;
  align-items:center;justify-content:center;overflow:auto;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px);}
.lightbox[hidden]{display:none;}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;display:block;touch-action:auto;}
.lightbox-close{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:201;
  width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,.2);
  color:#fff;font-size:26px;line-height:1;cursor:pointer;}

/* 关于 */
.about{background:#fff;border-radius:var(--radius);padding:18px;line-height:1.7;}
.about h3{margin:0 0 10px;}
.about p{margin:8px 0;font-size:14px;}
.about .muted{color:var(--muted);font-size:13px;}
.about hr{border:none;border-top:1px solid var(--line);margin:14px 0;}
.about .btn{width:100%;margin-top:10px;}

/* 底部 tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;}
.tab span{font-size:11px;}
.tab.active{color:var(--primary);}

/* 裁剪弹层 */
.crop-modal{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;overflow:hidden;}
.crop-modal[hidden]{display:none;}
.crop-head{color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px;font-size:16px;font-weight:600;}
.crop-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 14px;}
.crop-frame{position:relative;flex:0 0 auto;line-height:0;}
.crop-img{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:none;}
.crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move;}
.crop-box .h{position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;border:2px solid var(--primary);}
.crop-box .h-nw{left:-11px;top:-11px;cursor:nwse-resize;}
.crop-box .h-ne{right:-11px;top:-11px;cursor:nesw-resize;}
.crop-box .h-sw{left:-11px;bottom:-11px;cursor:nesw-resize;}
.crop-box .h-se{right:-11px;bottom:-11px;cursor:nwse-resize;}
.crop-foot{display:flex;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);}
.crop-foot .btn{flex:1;}

/* 确认弹窗 */
.modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px;}
.modal[hidden]{display:none;}
.modal-card{background:#fff;border-radius:16px;padding:20px;max-width:300px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.2);}
.modal-text{font-size:16px;margin-bottom:18px;color:var(--ink);}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}

.ver{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 16px;}

/* 底部标题选择面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:110;background:#fff;border-radius:18px 18px 0 0;
  box-shadow:0 -4px 30px rgba(0,0,0,.15);max-width:560px;margin:0 auto;padding:0 0 env(safe-area-inset-bottom);}
.sheet[hidden]{display:none;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:15px;font-weight:600;}
.sheet-body{max-height:50vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;}
.sheet-item{display:block;width:100%;text-align:left;border:none;background:#f7f7f9;border-radius:12px;
  padding:12px 14px;margin-bottom:8px;font-size:15px;line-height:1.5;color:var(--ink);font-family:inherit;}
.sheet-item:active{background:#efeafc;}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">📌 随手收藏</div>
    <input id="search" class="search" type="search" placeholder="搜索文字 / 标签…" autocomplete="off">
  </header>

  <!-- 收藏列表 -->
  <section id="view-library" class="view active">
    <div id="filters" class="filters"></div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty" hidden>还没有收藏，点下面的 ➕ 添加截图吧</div>
  </section>

  <!-- 添加 -->
  <section id="view-add" class="view">
    <div class="add-wrap">
      <label id="drop" class="drop">
        <input id="file" type="file" accept="image/*" hidden>
        <div class="preview-box">
          <div class="drop-hint">📷 点击选择截图<br><small>从相册选择或拍照</small></div>
          <img id="preview" class="preview-img" hidden>
        </div>
      </label>
      <label class="field">
        <span>文字内容（想记的话直接粘这里）</span>
        <textarea id="text" rows="5" placeholder="比如一句想存的话、一段文案、读书笔记…"></textarea>
        <div class="row between">
          <button id="copyBtn" class="btn tiny" type="button">📋 复制文字</button>
          <span id="autoHint" class="auto-hint"></span>
        </div>
      </label>
      <label class="field">
        <span>链接（可选，如商品 / 文章网址）</span>
        <input id="link" type="url" inputmode="url" placeholder="https://…（没有截图、只存链接也行）">
      </label>
      <label class="field">
        <span>标题（自动生成，可改）</span>
        <div class="title-row">
          <input id="title" type="text" placeholder="如：想看的书 / 一条文案">
          <button id="pickTitleBtn" class="btn tiny" type="button">从文字选</button>
        </div>
      </label>
      <label class="field">
        <span>分类</span>
        <select id="category"></select>
      </label>
      <label class="field">
        <span>标签（逗号分隔）</span>
        <input id="tags" type="text" placeholder="如：待读, 送礼物">
      </label>
      <button id="saveBtn" class="btn primary" disabled>💾 保存到收藏</button>
    </div>
  </section>

  <!-- 详情 -->
  <section id="view-detail" class="view">
    <div id="detail" class="detail"></div>
    <div class="row detail-actions">
      <button id="editBtn" class="btn">✏️ 编辑</button>
      <button id="delBtn" class="btn danger">🗑 删除</button>
    </div>
  </section>

  <!-- 关于 -->
  <section id="view-about" class="view">
    <div class="about">
      <h3>关于「随手收藏」</h3>
      <p>一个放在手机首页的私人截图收纳盒。上传截图 → 裁剪 → 自动分类 → 保存。</p>
      <p><b>添加到主屏幕：</b>在 iPhone 的 Safari 打开本页面 → 点底部「分享」按钮 →「添加到主屏幕」。</p>
      <p>数据保存在本机浏览器（IndexedDB），<b>不上传任何服务器</b>。可随时导出备份。</p>
      <hr>
      <p class="muted">分类：电影/剧集 · 书籍 · 穿搭好物 · 美食 · 文字摘抄 · 其他</p>
      <button id="exportBtn" class="btn">⬇️ 导出备份 (JSON)</button>
      <button id="importBtn" class="btn ghost">⬆️ 导入备份</button>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
  </section>

  <nav class="tabbar">
    <button class="tab active" data-view="library">📚<span>收藏</span></button>
    <button class="tab" data-view="add">➕<span>添加</span></button>
    <button class="tab" data-view="about">❓<span>关于</span></button>
  </nav>

  <!-- 裁剪 -->
  <div id="cropModal" class="crop-modal" hidden>
    <div class="crop-head">✂️ 调整裁剪区域</div>
    <div id="cropStage" class="crop-stage">
      <div id="cropFrame" class="crop-frame">
        <img id="cropImg" class="crop-img" alt="">
        <div id="cropBox" class="crop-box">
          <span class="h h-nw" data-h="nw"></span>
          <span class="h h-ne" data-h="ne"></span>
          <span class="h h-sw" data-h="sw"></span>
          <span class="h h-se" data-h="se"></span>
        </div>
      </div>
    </div>
    <div class="crop-foot">
      <button id="cropCancel" class="btn ghost">取消</button>
      <button id="cropReset" class="btn ghost">满屏</button>
      <button id="cropConfirm" class="btn primary">确定裁剪</button>
    </div>
  </div>

  <!-- 确认弹窗（删除用，避免 iOS 原生 confirm 不弹窗导致删不掉） -->
  <div id="confirmModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-text" id="confirmText">确定删除这条收藏？</div>
      <div class="modal-actions">
        <button id="confirmCancel" class="btn ghost">取消</button>
        <button id="confirmOk" class="btn danger">删除</button>
      </div>
    </div>
  </div>

  <!-- 全屏看图（点击图片弹出，可双指缩放，点背景或 × 关闭） -->
  <div id="lightbox" class="lightbox" hidden>
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="关闭">×</button>
    <img id="lightboxImg" alt="查看大图">
  </div>

  <!-- 从文字中选标题 -->
  <div id="titlePicker" class="sheet" hidden>
    <div class="sheet-head">
      <span>选一句作为标题</span>
      <button id="titlePickerClose" class="btn tiny" type="button">取消</button>
    </div>
    <div id="titlePickerBody" class="sheet-body"></div>
  </div>

  <div class="ver">v11-standalone</div>
</div>
<script>
(function () {
  'use strict';

  const $ = s => document.querySelector(s);

  // ---------- 分类配置（可在此增删分类与关键词） ----------
  const CATEGORIES = [
    { key: 'movie',   name: '电影/剧集', color: '#e17055', keywords: ['电影', '豆瓣', '评分', '导演', '主演', '观影', 'imdb', '票房', '电视剧', '综艺', '纪录片', '影院', '剧', '追剧'] },
    { key: 'book',    name: '书籍',      color: '#0984e3', keywords: ['书', '作者', '出版', '小说', '书单', '豆瓣读书', 'kindle', '阅读', '出版社', '文库', '读', '新书'] },
    { key: 'fashion', name: '穿搭好物',  color: '#e84393', keywords: ['穿搭', '同款', '衣服', '裙子', '外套', '淘宝', '好物', '购买', '拼多多', '京东', '小红书', '种草', '颜值', '链接', '搭配', '包', '鞋', '淘宝', '天猫'] },
    { key: 'food',    name: '美食',      color: '#00b894', keywords: ['美食', '菜谱', '餐厅', '好吃', '探店', '做法', '食谱', '料理', '甜品', '咖啡', '探店'] },
    { key: 'quote',   name: '文字摘抄',  color: '#6c5ce7', keywords: ['句子', '语录', '名言', '文案', '摘抄', '金句', '段落', '治愈', '诗词', '文案', '短句'] },
    { key: 'other',   name: '其他',      color: '#636e72', keywords: [] }
  ];
  const CAT_MAP = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));

  function classify(text) {
    const t = (text || '').toLowerCase();
    let best = { key: 'other', score: 0 };
    for (const c of CATEGORIES) {
      if (c.key === 'other') continue;
      let s = 0;
      for (const k of c.keywords) if (t.includes(k.toLowerCase())) s++;
      if (s > best.score) best = { key: c.key, score: s };
    }
    return best.score > 0 ? best.key : 'other';
  }

  // ---------- localStorage 存储（单文件版 file:// 兼容） ----------
  const LS_KEY = 'clipSaverStandalone';
  function lsRead() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function lsWrite(arr) { try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch (e) {} }
  function getAll() {
    return Promise.resolve(lsRead().sort((a, b) => (b.created || 0) - (a.created || 0)));
  }
  async function addItem(it) {
    const arr = lsRead();
    it.id = Date.now() + Math.floor(Math.random() * 1000);
    arr.push(it);
    lsWrite(arr);
    return it.id;
  }
  async function putItem(it) {
    const arr = lsRead();
    const idx = arr.findIndex(x => x.id === it.id);
    if (idx >= 0) arr[idx] = it; else arr.push(it);
    lsWrite(arr);
  }
  async function delItem(id) {
    const arr = lsRead().filter(x => x.id !== id);
    lsWrite(arr);
  }
  async function getById(id) {
    return lsRead().find(x => x.id === id) || null;
  }

  // ---------- 状态 ----------
  const state = { filter: 'all', q: '', currentId: null };
  let draftImage = null;   // 当前草稿图片 dataURL
  let editingId = null;    // 编辑中的条目 id
  let confirmResolve = null; // 自定义确认弹窗的 resolve

  // ---------- 视图切换 ----------
  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    $('#view-' + name).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
    window.scrollTo(0, 0);
  }

  // 压缩已由裁剪环节（confirmCrop）统一处理

  // ---------- 裁剪 ----------
  const cropModal = $('#cropModal');
  const cropImg = $('#cropImg');
  const cropStage = $('#cropStage');
  const cropFrame = $('#cropFrame');
  const cropBox = $('#cropBox');
  let cropScale = 1;
  let cropState = null;
  let drag = null;

  // 读取 JPEG 的 EXIF Orientation，修正从相册选的真实照片方向（截屏 PNG 不受影响）
  function getOrientation(buf) {
    try {
      const view = new DataView(buf);
      if (view.getUint16(0) !== 0xFFD8) return 1; // 非 JPEG（如 PNG 截屏）无需处理
      const len = view.byteLength;
      let off = 2;
      while (off < len) {
        const marker = view.getUint16(off); off += 2;
        if (marker === 0xFFE1) {
          const exif = off + 2;
          if (view.getUint32(exif) === 0x45786966) { // "Exif"
            const tiff = exif + 6;
            const little = view.getUint16(tiff) === 0x4949;
            const dir = tiff + view.getUint32(tiff + 4, little);
            const entries = view.getUint16(dir, little);
            for (let i = 0; i < entries; i++) {
              const eo = dir + 2 + i * 12;
              if (view.getUint16(eo, little) === 0x0112) return view.getUint16(eo + 8, little);
            }
          }
          return 1;
        }
        if ((marker & 0xFF00) !== 0xFF00) break;
        off += view.getUint16(off);
      }
    } catch (_) {}
    return 1;
  }
  function loadImg(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = src;
    });
  }
  async function fixOrientation(dataUrl) {
    try {
      const buf = await (await fetch(dataUrl)).arrayBuffer();
      const orient = getOrientation(buf);
      if (orient === 1 || !orient) return dataUrl;
      const img = await loadImg(dataUrl);
      const w = img.naturalWidth, h = img.naturalHeight;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (orient === 6 || orient === 8) { canvas.width = h; canvas.height = w; }
      else { canvas.width = w; canvas.height = h; }
      ctx.save();
      switch (orient) {
        case 2: ctx.translate(w, 0); ctx.scale(-1, 1); break;
        case 3: ctx.translate(w, h); ctx.rotate(Math.PI); break;
        case 4: ctx.translate(0, h); ctx.scale(1, -1); break;
        case 5: ctx.translate(h, 0); ctx.rotate(Math.PI / 2); ctx.scale(-1, 1); break;
        case 6: ctx.translate(h, 0); ctx.rotate(Math.PI / 2); break;
        case 7: ctx.translate(0, w); ctx.rotate(-Math.PI / 2); ctx.scale(-1, 1); break;
        case 8: ctx.translate(0, w); ctx.rotate(-Math.PI / 2); break;
      }
      ctx.drawImage(img, 0, 0);
      ctx.restore();
      return canvas.toDataURL('image/jpeg', 0.92);
    } catch (_) { return dataUrl; }
  }

  function openCropper(dataUrl) {
    cropModal.hidden = false;
    cropImg.onload = () => {
      const maxW = window.innerWidth - 28;
      const maxH = Math.min(window.innerHeight * 0.6, 520);
      const natW = cropImg.naturalWidth, natH = cropImg.naturalHeight;
      const scale = Math.min(maxW / natW, maxH / natH, 1);
      cropScale = scale;
      const dw = Math.round(natW * scale), dh = Math.round(natH * scale);
      // 关键：用内层 cropFrame 作为 img 与 cropBox 的统一定位基准，避免被 flex 居中造成原点错位（黑色/上移）
      cropFrame.style.width = dw + 'px';
      cropFrame.style.height = dh + 'px';
      const w = Math.round(dw * 0.92), h = Math.round(dh * 0.92);
      cropState = { left: Math.round((dw - w) / 2), top: Math.round((dh - h) / 2), w, h };
      applyCropBox();
    };
    cropImg.src = dataUrl;
  }

  function applyCropBox() {
    cropBox.style.left = cropState.left + 'px';
    cropBox.style.top = cropState.top + 'px';
    cropBox.style.width = cropState.w + 'px';
    cropBox.style.height = cropState.h + 'px';
  }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function onPointerDown(e) {
    e.preventDefault();
    const handle = e.target.dataset && e.target.dataset.h;
    drag = { mode: handle ? 'resize-' + handle : 'move', sx: e.clientX, sy: e.clientY, box: Object.assign({}, cropState) };
    try { cropBox.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function onPointerMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    const b = drag.box, SW = cropFrame.clientWidth, SH = cropFrame.clientHeight, MIN = 30;
    if (drag.mode === 'move') {
      cropState = { left: clamp(b.left + dx, 0, SW - b.w), top: clamp(b.top + dy, 0, SH - b.h), w: b.w, h: b.h };
    } else {
      const right = b.left + b.w, bottom = b.top + b.h;
      let left = b.left, top = b.top, w = b.w, h = b.h;
      if (drag.mode.indexOf('e') >= 0) w = clamp(b.w + dx, MIN, SW - b.left);
      if (drag.mode.indexOf('s') >= 0) h = clamp(b.h + dy, MIN, SH - b.top);
      if (drag.mode.indexOf('w') >= 0) { left = clamp(b.left + dx, 0, right - MIN); w = right - left; }
      if (drag.mode.indexOf('n') >= 0) { top = clamp(b.top + dy, 0, bottom - MIN); h = bottom - top; }
      cropState = { left, top, w, h };
    }
    applyCropBox();
  }
  function onPointerUp() { drag = null; }

  function confirmCrop() {
    const natW = cropImg.naturalWidth, natH = cropImg.naturalHeight;
    let sx = cropState.left / cropScale, sy = cropState.top / cropScale;
    let sw = cropState.w / cropScale, sh = cropState.h / cropScale;
    // 防止源矩形超出原图 → 图外区域透明 → 转 JPEG 变黑
    if (sx < 0) { sw += sx; sx = 0; }
    if (sy < 0) { sh += sy; sy = 0; }
    if (sx + sw > natW) sw = natW - sx;
    if (sy + sh > natH) sh = natH - sy;
    if (!(sw > 0 && sh > 0)) { sx = 0; sy = 0; sw = natW; sh = natH; }
    const maxDim = 1600;
    let outW = Math.round(sw), outH = Math.round(sh);
    const sc = Math.min(1, maxDim / Math.max(outW, outH));
    outW = Math.round(outW * sc); outH = Math.round(outH * sc);
    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    c.getContext('2d').drawImage(cropImg, sx, sy, sw, sh, 0, 0, outW, outH);
    draftImage = c.toDataURL('image/jpeg', 0.82);
    $('#preview').src = draftImage; $('#preview').hidden = false;
    document.querySelector('.drop-hint').style.display = 'none';
    updateSaveState();
    closeCropper();
  }
  function closeCropper() { cropModal.hidden = true; }

  // ---------- 分类标签（带序号小色圈，去长方形） ----------
  function chip(cat) {
    const c = CAT_MAP[cat] || CAT_MAP.other;
    const idx = CATEGORIES.findIndex(x => x.key === (cat || 'other')) + 1;
    return '<span class="cat"><span class="cat-num" style="background:' + c.color + '">' + idx + '</span>' + c.name + '</span>';
  }

  // ---------- 自定义确认弹窗（绕开 iOS 原生 confirm 不弹窗的问题） ----------
  function askConfirm(text) {
    return new Promise(res => {
      confirmResolve = res;
      $('#confirmText').textContent = text;
      $('#confirmModal').hidden = false;
    });
  }

  // ---------- 渲染列表（横排条目 + 序号 + 列表内删除） ----------
  async function render() {
    const items = await getAll();
    let view = items;
    if (state.filter && state.filter !== 'all') view = view.filter(i => i.category === state.filter);
    if (state.q) {
      const q = state.q.toLowerCase();
      view = view.filter(i =>
        (i.text || '').toLowerCase().includes(q) ||
        (i.title || '').toLowerCase().includes(q) ||
        (i.link || '').toLowerCase().includes(q) ||
        (i.tags || []).join(' ').toLowerCase().includes(q));
    }
    const list = $('#list');
    $('#empty').hidden = items.length > 0;
    if (!view.length) {
      list.innerHTML = '<div class="empty" style="width:100%">没有匹配的内容</div>';
      return;
    }
    list.innerHTML = view.map((it, i) => {
      const c = CAT_MAP[it.category] || CAT_MAP.other;
      const thumbSrc = it.image || (it.text ? generateTextThumb(it.text, c.color) : (it.thumb || ''));
      const thumb = thumbSrc ? '<img class="thumb" src="' + thumbSrc + '">' : '<div class="thumb empty">📝</div>';
      const sub = (it.text || '').replace(/\n/g, ' ').slice(0, 80) || (it.tags || []).join(' ') || (it.link ? '🔗 ' + it.link : '') || '';
      return '<div class="card" data-id="' + it.id + '">' +
        '<div class="seq">' + (i + 1) + '</div>' + thumb +
        '<div class="body">' + chip(it.category) +
        '<div class="ttl">' + escapeHtml(titleOf(it)) + '</div>' +
        '<div class="sub">' + escapeHtml(sub) + '</div></div>' +
        '<button class="del" type="button" data-id="' + it.id + '" aria-label="删除">×</button>' +
      '</div>';
    }).join('');
  }

  function renderFilters() {
    const f = $('#filters');
    const all = [{ key: 'all', name: '全部', color: 'var(--primary)' }].concat(
      CATEGORIES.map((c, i) => Object.assign({}, c, { _n: i + 1 }))
    );
    f.innerHTML = all.map(c =>
      '<button class="chip' + (state.filter === c.key ? ' active' : '') + '" data-f="' + c.key + '">' +
      (c._n ? '<span class="chip-num">' + c._n + '</span>' : '') + c.name + '</button>'
    ).join('');
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }
  // 显示标题时自动回退：自定义标题 > 文字第一行 > 链接 > 柔和兜底
  function titleOf(it) {
    const t = (it.title || '').trim();
    if (t && t !== '未命名') return t.length > 42 ? t.slice(0, 42) + '…' : t;
    const line = (it.text || '').split('\n')[0].trim();
    if (line) return line.length > 42 ? line.slice(0, 42) + '…' : line;
    const link = (it.link || '').trim();
    if (link) return link.length > 42 ? link.slice(0, 42) + '…' : link;
    return '一条收藏';
  }

  // 从文字内容中提取标题候选
  function extractTitleCandidates(text) {
    const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    const out = [];
    for (const line of lines) {
      if (out.length >= 6) break;
      if (line.length <= 60) { out.push(line); continue; }
      const parts = line.split(/([。！？.!?]+)/);
      let buf = '';
      for (let i = 0; i < parts.length; i++) {
        buf += parts[i];
        if (/[。！？.!?]$/.test(parts[i]) || i === parts.length - 1) {
          const s = buf.trim();
          if (s) out.push(s);
          buf = '';
          if (out.length >= 6) break;
        }
      }
    }
    return out.slice(0, 6);
  }
  function openTitlePicker() {
    const text = $('#text').value.trim();
    if (!text) { alert('先输入文字内容'); return; }
    const candidates = extractTitleCandidates(text);
    if (!candidates.length) { alert('没有可提取的句子'); return; }
    const body = $('#titlePickerBody');
    body.innerHTML = candidates.map(c =>
      '<button class="sheet-item" type="button">' + escapeHtml(c.length > 60 ? c.slice(0, 60) + '…' : c) + '</button>'
    ).join('');
    $('#titlePicker').hidden = false;
  }
  function closeTitlePicker() { $('#titlePicker').hidden = true; }

  // 文字缩略图：无图时给列表一个统一的小图
  function hexToRgba(hex, alpha) {
    const m = hex.replace('#', '').match(/(.{2})(.{2})(.{2})/);
    if (!m) return 'rgba(241,240,254,' + alpha + ')';
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + alpha + ')';
  }
  function generateTextThumb(text, color) {
    const size = 112;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    // 纯白底（JPEG 导出前先铺白，避免透明区变黑）
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    // 顶部一道分类色细条，区分条目又保持白底清爽
    ctx.fillStyle = hexToRgba(color || '#6c5ce7', 0.9);
    ctx.fillRect(0, 0, size, 4);
    ctx.fillStyle = '#2d3436';
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
    ctx.textBaseline = 'top';
    const sample = (text || '').replace(/\n/g, ' ').trim().slice(0, 40) + ((text || '').length > 40 ? '…' : '');
    const lineH = 17;
    const lines = [];
    let line = '';
    for (const ch of sample) {
      const test = line + ch;
      if (ctx.measureText(test).width > size - 16 && line) {
        lines.push(line);
        line = ch;
        if (lines.length >= 4) break;
      } else { line = test; }
    }
    if (line && lines.length < 4) lines.push(line);
    let y = 14;
    for (const l of lines) { ctx.fillText(l, 8, y); y += lineH; }
    return c.toDataURL('image/jpeg', 0.92);
  }

  // 仅允许 http/https 链接，避免 javascript: 等危险协议
  function safeUrl(u) {
    try { const p = new URL(u); if (p.protocol === 'http:' || p.protocol === 'https:') return p.href; } catch (e) {}
    return '';
  }

  // 有图 / 有链接 / 有标题 / 有文字 任一即可保存
  function updateSaveState() {
    const has = draftImage || $('#title').value.trim() || $('#link').value.trim() || $('#text').value.trim();
    $('#saveBtn').disabled = !has;
  }

  // ---------- 全屏看图 ----------
  function openLightbox(src) {
    if (!src) return;
    $('#lightboxImg').src = src;
    $('#lightbox').hidden = false;
  }
  function closeLightbox() { $('#lightbox').hidden = true; $('#lightboxImg').src = ''; }

  // ---------- 详情 ----------
  async function openDetail(id) {
    const it = await getById(id);
    if (!it) return;
    state.currentId = id;
    $('#detail').innerHTML =
      (it.image ? '<figure class="shot" id="detailShot"><img src="' + it.image + '"><figcaption>👆 点击图片看大图</figcaption></figure>' : '') +
      '<div class="meta">' +
      chip(it.category) +
      '<h3>' + escapeHtml(titleOf(it)) + '</h3>' +
      (it.tags && it.tags.length ? '<div class="tags">' + it.tags.map(t => '<span class="tag">#' + escapeHtml(t) + '</span>').join('') + '</div>' : '') +
      (it.text ? '<div class="text">' + escapeHtml(it.text) + '</div>' : '') +
      (it.link ? (function () { const u = safeUrl(it.link); return u ? '<a class="link" href="' + u + '" target="_blank" rel="noopener">🔗 ' + escapeHtml(it.link) + '</a>' : '<div class="link-text">🔗 ' + escapeHtml(it.link) + '</div>'; })() : '') +
      '<div class="time">创建：' + new Date(it.created).toLocaleString('zh-CN') +
      (it.updated && it.updated !== it.created ? '　·　更新：' + new Date(it.updated).toLocaleString('zh-CN') : '') + '</div>' +
      '</div>';
    showView('detail');
  }

  // ---------- 表单 ----------
  function resetForm() {
    editingId = null; draftImage = null;
    $('#title').value = ''; $('#tags').value = ''; $('#text').value = ''; $('#link').value = '';
    $('#category').value = 'other'; $('#autoHint').textContent = '';
    $('#preview').hidden = true; $('#preview').src = '';
    document.querySelector('.drop-hint').style.display = '';
    updateSaveState();
  }
  function loadToForm(it) {
    editingId = it.id; draftImage = it.image || null;
    $('#title').value = titleOf(it);
    $('#link').value = it.link || '';
    $('#category').value = it.category || 'other';
    $('#tags').value = (it.tags || []).join(', ');
    $('#text').value = it.text || '';
    if (it.image) { $('#preview').src = it.image; $('#preview').hidden = false; document.querySelector('.drop-hint').style.display = 'none'; }
    updateSaveState(); updateAutoHint();
    showView('add');
  }

  async function save() {
    const text = $('#text').value.trim();
    const link = $('#link').value.trim();
    const title = $('#title').value.trim() || (text.split('\n')[0].slice(0, 40)) || (link ? link : '未命名');
    const category = $('#category').value;
    const item = {
      title,
      link,
      category,
      tags: $('#tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      text,
      image: draftImage,
      created: editingId ? (await getById(editingId)).created : Date.now(),
      updated: Date.now()
    };
    if (editingId) { item.id = editingId; await putItem(item); }
    else await addItem(item);
    resetForm();
    state.filter = 'all'; state.q = ''; $('#search').value = '';
    renderFilters(); render(); showView('library');
  }

  // ---------- 初始化 ----------
  function init() {
    // 分类下拉
    $('#category').innerHTML = CATEGORIES.map(c => '<option value="' + c.key + '">' + c.name + '</option>').join('');
    renderFilters(); render();

    // tab
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));

    // 筛选
    $('#filters').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      state.filter = b.dataset.f; renderFilters(); render();
    });

    // 搜索
    let to;
    $('#search').addEventListener('input', e => {
      clearTimeout(to);
      to = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 200);
    });

    // 列表点击（缩略图→看大图；其余→进详情；删除按钮→确认删除）
    $('#list').addEventListener('click', e => {
      const delBtn = e.target.closest('.del');
      if (delBtn) {
        e.stopPropagation();
        const id = Number(delBtn.dataset.id);
        askConfirm('确定删除这条收藏？').then(ok => { if (ok) delItem(id).then(render); });
        return;
      }
      const thumb = e.target.closest('.thumb');
      if (thumb) {
        const src = thumb.getAttribute('src');
        if (src) { openLightbox(src); return; }
      }
      const card = e.target.closest('.card'); if (card) openDetail(Number(card.dataset.id));
    });

    // 详情页：点击图片弹大图
    $('#detail').addEventListener('click', e => {
      const shot = e.target.closest('.shot');
      if (shot) {
        const img = shot.querySelector('img');
        if (img && img.src) openLightbox(img.src);
      }
    });

    // 全屏看图：关闭按钮 / 点背景 / 返回手势
    $('#lightboxClose').addEventListener('click', closeLightbox);
    $('#lightbox').addEventListener('click', e => { if (e.target === $('#lightbox')) closeLightbox(); });

    // 选图 → 进入裁剪
    $('#file').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const fixed = await fixOrientation(reader.result); // 先摆正方向，再进入裁剪
        openCropper(fixed);
      };
      reader.readAsDataURL(f);
      e.target.value = '';
    });

    $('#cropCancel').addEventListener('click', closeCropper);
    $('#cropReset').addEventListener('click', () => {
      const dw = cropFrame.clientWidth, dh = cropFrame.clientHeight;
      cropState = { left: 0, top: 0, w: dw, h: dh };
      applyCropBox();
    });
    $('#cropConfirm').addEventListener('click', confirmCrop);
    cropBox.addEventListener('pointerdown', onPointerDown);
    cropBox.addEventListener('pointermove', onPointerMove);
    cropBox.addEventListener('pointerup', onPointerUp);
    cropBox.addEventListener('pointercancel', onPointerUp);
    $('#copyBtn').addEventListener('click', async () => {
      const t = $('#text').value;
      try { await navigator.clipboard.writeText(t); $('#copyBtn').textContent = '✓ 已复制'; setTimeout(() => $('#copyBtn').textContent = '📋 复制文字', 1500); }
      catch { alert('请手动长按文字选择复制'); }
    });
    $('#pickTitleBtn').addEventListener('click', openTitlePicker);
    $('#titlePickerClose').addEventListener('click', closeTitlePicker);
    $('#titlePickerBody').addEventListener('click', e => {
      const btn = e.target.closest('.sheet-item'); if (!btn) return;
      $('#title').value = btn.textContent;
      updateSaveState(); updateAutoHint();
      closeTitlePicker();
    });
    function updateAutoHint() {
      const text = $('#text').value.trim();
      const title = $('#title').value.trim();
      $('#autoHint').textContent = (text && !title) ? '可点「从文字选」挑标题' : '';
    }
    $('#saveBtn').addEventListener('click', save);
    // 链接/标题/文字任一有内容即可保存（支持只存链接不传图）
    ['#title', '#link', '#text'].forEach(sel => $(sel).addEventListener('input', () => { updateSaveState(); updateAutoHint(); }));

    // 详情操作
    $('#editBtn').addEventListener('click', () => { if (state.currentId != null) getById(state.currentId).then(loadToForm); });
    $('#delBtn').addEventListener('click', () => {
      if (state.currentId == null) return;
      askConfirm('确定删除这条收藏？').then(ok => {
        if (ok) delItem(state.currentId).then(() => { state.currentId = null; render(); showView('library'); });
      });
    });

    // 确认弹窗按钮
    $('#confirmOk').addEventListener('click', () => {
      $('#confirmModal').hidden = true;
      const r = confirmResolve; confirmResolve = null; if (r) r(true);
    });
    $('#confirmCancel').addEventListener('click', () => {
      $('#confirmModal').hidden = true;
      const r = confirmResolve; confirmResolve = null; if (r) r(false);
    });

    // 关于：导出 / 导入
    $('#exportBtn').addEventListener('click', async () => {
      const items = await getAll();
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'clip-saver-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
    });
    $('#importBtn').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const arr = JSON.parse(await f.text());
        for (const it of arr) { if (it.id) await putItem(it); else await addItem(it); }
        render(); alert('导入完成：' + arr.length + ' 条');
      } catch (err) { alert('导入失败：文件格式不正确'); }
      e.target.value = '';
    });

    // Service Worker
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      let swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!swReloaded) { swReloaded = true; location.reload(); }
      });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
